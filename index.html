<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frame — Outreach Pipeline</title>
<style>
:root{
  --bg:#0F1012; --surface:#17181C; --surface2:#1E2025; --line:#2A2C33;
  --ink:#F2F0EA; --muted:#8B8D94; --dim:#5A5C63;
  --amber:#F5A524; --green:#4ADE80; --red:#F87171; --blue:#7DAFFF;
  --serif:Georgia,'Times New Roman',serif; --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-bottom:80px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

header{padding:34px 0 8px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:600}
h1{font-family:var(--serif);font-size:44px;font-weight:400;line-height:1.05;margin:6px 0 18px}
h1 em{font-style:italic;color:var(--amber)}
.statbar{display:flex;gap:0;border-top:1px solid var(--line);flex-wrap:wrap}
.stat{flex:1;min-width:110px;padding:14px 16px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .n{font-family:var(--serif);font-size:30px;line-height:1}
.stat .l{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.stat.hot .n{color:var(--amber)}
.stat.good .n{color:var(--green)}

section{margin-top:34px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
h2{font-family:var(--serif);font-size:24px;font-weight:400}
.sec-sub{color:var(--muted);font-size:12.5px}

.batch{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;position:relative;cursor:pointer;transition:border-color .15s}
.slot:hover{border-color:var(--dim)}
.slot.due{border-color:var(--amber)}
.slot.empty{border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:132px;color:var(--dim);font-size:12.5px;cursor:default}
.slot .name{font-weight:600;font-size:14.5px;margin-bottom:2px;padding-right:26px}
.slot .meta{font-size:11.5px;color:var(--muted)}
.slot .stage-pill{margin-top:10px}
.slot .clock{margin-top:10px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.slot .clock b{font-family:var(--serif);font-size:20px;font-weight:400}
.slot.due .clock b{color:var(--amber)}
.slot .fu{position:absolute;top:12px;right:12px;font-size:10.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.slot .duebadge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;color:#000;background:var(--amber);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}

.pill{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.pill.tA{color:#000;background:var(--amber);border-color:var(--amber)}
.pill.tB{color:var(--amber);border-color:var(--amber)}
.pill.tC{color:var(--muted)}
.st-backlog{color:var(--muted)}
.st-research{color:var(--blue);border-color:var(--blue)}
.st-spec{color:var(--blue);border-color:var(--blue)}
.st-sent{color:var(--amber);border-color:var(--amber)}
.st-followup{color:var(--amber);border-color:var(--amber)}
.st-replied{color:var(--green);border-color:var(--green)}
.st-call{color:var(--green);border-color:var(--green)}
.st-won{color:#000;background:var(--green);border-color:var(--green)}
.st-dead{color:var(--red);border-color:var(--red);opacity:.75}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--sans)}
.fbtn.on{color:var(--ink);border-color:var(--ink)}

.leads{display:flex;flex-direction:column;gap:8px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lead.due{border-left:3px solid var(--amber)}
.lead-row{display:grid;grid-template-columns:minmax(160px,1.6fr) 70px 110px 90px 90px auto;gap:10px;align-items:center;padding:12px 16px;cursor:pointer}
.lead-row:hover{background:var(--surface2)}
.lead .nm{font-weight:600;font-size:14px}
.lead .nm a{color:var(--blue);text-decoration:none;font-size:12px;margin-left:6px}
.lead .nm a:hover{text-decoration:underline}
.lead .hd{font-size:11.5px;color:var(--muted)}
.cell{font-size:12px;color:var(--muted)}
.cell b{color:var(--ink);font-weight:600}
.chev{color:var(--dim);justify-self:end;transition:transform .15s}
.lead.open .chev{transform:rotate(90deg)}

.detail{display:none;border-top:1px solid var(--line);padding:16px;background:var(--surface2)}
.lead.open .detail{display:block}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.d-grid{grid-template-columns:1fr}}
.d-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:600;margin-bottom:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button.act{background:var(--ink);color:#000;border:none;border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
button.act.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.act.warn{background:transparent;color:var(--red);border:1px solid var(--red)}
button.act:hover{opacity:.85}
select.stagesel{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px;font-family:var(--sans)}
textarea.notes{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:var(--sans);font-size:13px;padding:10px;min-height:84px;resize:vertical}
input.linkinput{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-family:var(--sans);font-size:12.5px;padding:8px 10px;margin-bottom:12px}
.hist{list-style:none;max-height:170px;overflow-y:auto}
.hist li{font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.hist li b{color:var(--ink);font-weight:500}
.hist li:last-child{border-bottom:none}

.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.addbar input{background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:9px 12px;font-size:13px;font-family:var(--sans);flex:1;min-width:130px}
.io{display:flex;gap:8px;margin-top:26px;justify-content:flex-end}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#000;font-weight:600;font-size:13px;padding:10px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
.rulecard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:12.5px;color:var(--muted);margin-top:14px}
.rulecard b{color:var(--ink)}

@media(max-width:760px){
  .lead-row{grid-template-columns:1fr auto;grid-template-areas:"nm chev" "cells cells"}
  .lead-row .nmwrap{grid-area:nm}
  .chev{grid-area:chev}
  .cellwrap{grid-area:cells;display:flex;gap:14px;flex-wrap:wrap}
  h1{font-size:34px}
}
</style>
</head>

  <div class="io">

    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>
</section>
</div>
<div class="toast" id="toast"></div>

  notes:'Crypto/fintech pod, VC hosts (incl. Samantha Lewis). Professional banner = they care about brand; 59 subs after 69 videos = distribution failing. Fund-adjacent budget likely. Solid shorts pitch.'},
 {name:'The Venture Capital Show',handle:'@TheVentureCapitalShow',subs:'6',tier:'C',stage:'backlog',
  link:'https://www.youtube.com/@TheVentureCapitalShow',
  notes:'Brand new (12 videos, 6 subs) but has proper branding + website — someone invested in launch. Check back in 2 months: if still publishing, they need everything and have some budget.'},
 {name:'Austin Chen',handle:'@akrolsmir',subs:'28',tier:'C',stage:'backlog',
  link:'https://www.youtube.com/@akrolsmir',
  notes:'Manifold Markets co-founder, 11 videos — personal channel, not a content operation. Skip.'}
];

let state = null;
let EDITOR = '';
let filterTier = 'ALL', filterStage = 'ALL';

function newLead(o){
  return Object.assign({
    id:uid(), name:'', handle:'', subs:'—', tier:'B', stage:'backlog', link:'',
    followUps:0, lastTouch:null, inBatch:false, batchStart:null,
    notes:'', history:[{date:now(),action:'Added to pipeline'}]
  }, o);
}

function mergeSeed(){
  const names = new Set(state.leads.map(l=>l.name.toLowerCase().trim()));
  let added = 0;
  SEED.forEach(s=>{
    const key = s.name.toLowerCase().trim();
    if(!names.has(key)){
      state.leads.push(newLead(Object.assign({}, s, s.inBatch ? {batchStart:now()} : {})));
      added++;
    } else {
      const existing = state.leads.find(l=>l.name.toLowerCase().trim()===key);
      if(existing && !existing.link && s.link) existing.link = s.link;
      if(existing && (existing.subs==='—'||!existing.subs) && s.subs) existing.subs = s.subs;
    }
  });
  return added;
}

const EDITOR_KEY = 'frame-editor-name';
const API = '/api/leads';
let backendOK = true;
let pollTimer = null;

async function apiGet(){
  const res = await fetch(API, { cache: 'no-store' });
  if(!res.ok) throw new Error('GET ' + res.status);
  return res.json();
}
async function apiSave(data){
  const res = await fetch(API, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('PUT ' + res.status);
}

async function load(){
  try{ EDITOR = localStorage.getItem(EDITOR_KEY) || ''; }catch(e){}
  if(!EDITOR){
    EDITOR = (prompt('Who is this? (name shows in lead history)','') || 'someone').trim() || 'someone';
    try{ localStorage.setItem(EDITOR_KEY, EDITOR); }catch(e){}
  }
  try{
    const data = await apiGet();
    state = (data && Array.isArray(data.leads)) ? data : { leads: [] };
    const added = mergeSeed();
    render();
    backendOK = true;
    if(added) save();
    startPolling();
    return;
  }catch(e){
    console.error('load failed', e);
    backendOK = false;
  }
  // Backend unreachable — render from the built-in seed list so the page still works,
  // but nothing typed in this state will be saved anywhere.
  state = { leads: [] };
  mergeSeed();
  render();
  toast('Can’t reach the server — working offline, changes won’t be saved');
}

async function save(){
  try{ await apiSave(state); backendOK = true; }
  catch(e){
    console.error('save failed', e);
    backendOK = false;
    toast('Save failed — check your connection');
  }
}

async function syncNow(){
  try{
    const data = await apiGet();
    if(data && Array.isArray(data.leads)) state = data;
    mergeSeed(); render();
    backendOK = true;
    toast('Synced latest');
  }catch(e){
    console.error('sync failed', e);
    backendOK = false;
    toast('Sync failed — check your connection');
  }
}

function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(async ()=>{
    try{
      const data = await apiGet();
      if(data && Array.isArray(data.leads)) { state = data; render(); }
      backendOK = true;
    }catch(e){ backendOK = false; }
  }, 20000);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncNow(); });

function isDue(l){
  if(!['sent','followup'].includes(l.stage)) return false;
  const d = daysSince(l.lastTouch);
  return d !== null && d >= FOLLOWUP_GAP_DAYS;
}

function log(l, action){ l.history.unshift({date:now(), action: (EDITOR? EDITOR+': ' : '') + action}); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- render ---------- */
function render(){
  renderStats(); renderBatch(); renderFilters(); renderLeads(); renderRule();
}

function renderStats(){
  const L = state.leads;
  const active = L.filter(l=>l.inBatch).length;
  const sent = L.filter(l=>['sent','followup'].includes(l.stage)).length;
  const replied = L.filter(l=>['replied','call'].includes(l.stage)).length;
  const won = L.filter(l=>l.stage==='won').length;
  const due = L.filter(isDue).length;
  document.getElementById('statbar').innerHTML = `
    <div class="stat"><div class="n">${L.filter(l=>!['won','dead'].includes(l.stage)).length}</div><div class="l">Open leads</div></div>
    <div class="stat"><div class="n">${active}/${BATCH_CAP}</div><div class="l">In batch</div></div>
    <div class="stat"><div class="n">${sent}</div><div class="l">Awaiting reply</div></div>
    <div class="stat ${due?'hot':''}"><div class="n">${due}</div><div class="l">Follow-ups due</div></div>
    <div class="stat good"><div class="n">${replied}</div><div class="l">Replied / call</div></div>
    <div class="stat good"><div class="n">${won}</div><div class="l">Won</div></div>`;
}

function renderBatch(){
  const el = document.getElementById('batch');
  const inBatch = state.leads.filter(l=>l.inBatch);
  let html = inBatch.map(l=>{
    const d = daysSince(l.lastTouch);
    const bd = daysSince(l.batchStart);
    const due = isDue(l);
    return `<div class="slot ${due?'due':''}" onclick="openLead('${l.id}')">
      <div class="fu">${l.followUps}/${MAX_FOLLOWUPS} follow-ups</div>
      <div class="name">${esc(l.name)}</div>
      <div class="meta">${esc(l.subs)} subs · day ${bd??0} of batch</div>
      <div class="stage-pill"><span class="pill st-${l.stage}">${STAGE_LABEL[l.stage]}</span>${due?'<span class="duebadge">DUE</span>':''}</div>
      <div class="clock"><span style="color:var(--muted)">${l.lastTouch?'since last touch':'no touches yet'}</span><b>${d===null?'—':d+'d'}</b></div>
    </div>`;
  }).join('');
  for(let i=inBatch.length;i<BATCH_CAP;i++)
    html += `<div class="slot empty">Open slot — promote a lead</div>`;
  el.innerHTML = html;
  document.getElementById('capLabel').textContent = BATCH_CAP;
}

function renderRule(){
  const overdue = state.leads.filter(l=>l.inBatch && daysSince(l.batchStart) > BATCH_WEEKS*7);
  const maxed = state.leads.filter(l=>l.inBatch && l.followUps >= MAX_FOLLOWUPS && !['replied','call','won'].includes(l.stage));
  let msg = `<b>The system:</b> a lead in the batch gets the full treatment — research, spec work (thumbnail redo + 1 short), send, then a follow-up every ${FOLLOWUP_GAP_DAYS}–5 days, max ${MAX_FOLLOWUPS}. After ${MAX_FOLLOWUPS} follow-ups or ${BATCH_WEEKS} weeks with no reply → mark <b>Dead</b> (revivable in 3 months) and promote the next lead. No lead leaves the batch by being forgotten — only by a decision.`;
  if(maxed.length) msg += `<br><br>⚠ <b>${maxed.map(l=>esc(l.name)).join(', ')}</b> hit max follow-ups — decide: dead or one final different-channel attempt.`;
  else if(overdue.length) msg += `<br><br>⚠ <b>${overdue.map(l=>esc(l.name)).join(', ')}</b> has been in the batch over ${BATCH_WEEKS} weeks — time to decide.`;
  document.getElementById('rulecard').innerHTML = msg;
}

function renderFilters(){
  const tiers = ['ALL','A','B','C'];
  const stages = ['backlog','sent','followup','replied','won','dead'];
  document.getElementById('filters').innerHTML =
    tiers.map(t=>`<button class="fbtn ${filterTier===t?'on':''}" onclick="setF('tier','${t}')">${t==='ALL'?'All tiers':'Tier '+t}</button>`).join('') +
    stages.map(s=>`<button class="fbtn ${filterStage===s?'on':''}" onclick="setF('stage','${s}')">${STAGE_LABEL[s]}</button>`).join('');
}
function setF(k,v){
  if(k==='tier') filterTier = (filterTier===v?'ALL':v);
  else filterStage = (filterStage===v?'ALL':v);
  render();
}

function renderLeads(){
  const order = {A:0,B:1,C:2};
  const stOrder = Object.fromEntries(STAGES.map(([k],i)=>[k,i]));
  let L = [...state.leads].sort((a,b)=>{
    if(a.inBatch!==b.inBatch) return a.inBatch?-1:1;
    if(order[a.tier]!==order[b.tier]) return order[a.tier]-order[b.tier];
    return stOrder[b.stage]-stOrder[a.stage];
  });
  if(filterTier!=='ALL') L = L.filter(l=>l.tier===filterTier);
  if(filterStage!=='ALL') L = L.filter(l=>l.stage===filterStage);

  document.getElementById('leads').innerHTML = L.map(l=>{
    const d = daysSince(l.lastTouch);
    const due = isDue(l);
    const linkTag = l.link ? `<a href="${esc(l.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">open ↗</a>` : '';
    return `<div class="lead ${due?'due':''}" id="row-${l.id}">
      <div class="lead-row" onclick="toggleLead('${l.id}')">
        <div class="nmwrap"><div class="nm">${esc(l.name)} ${linkTag}</div><div class="hd">${esc(l.handle)}</div></div>
        <div class="cellwrap" style="display:contents">
          <div class="cell"><span class="pill t${l.tier}">Tier ${l.tier}</span></div>
          <div class="cell"><span class="pill st-${l.stage}">${STAGE_LABEL[l.stage]}${due?' ·DUE':''}</span></div>
          <div class="cell"><b>${esc(l.subs)}</b></div>
          <div class="cell"><b>${l.followUps}</b> fu · ${d===null?'—':d+'d ago'}</div>
        </div>
        <div class="chev">›</div>
      </div>
      <div class="detail">
        <div class="actions">
          ${l.inBatch
            ? `<button class="act ghost" onclick="event.stopPropagation();demote('${l.id}')">Remove from batch</button>`
            : `<button class="act" onclick="event.stopPropagation();promote('${l.id}')">→ Promote to batch</button>`}
          <button class="act" onclick="event.stopPropagation();touch('${l.id}')">Log touch (sent / followed up)</button>
          <select class="stagesel" onchange="setStage('${l.id}',this.value)" onclick="event.stopPropagation()">
            ${STAGES.map(([k,v])=>`<option value="${k}" ${l.stage===k?'selected':''}>${v}</option>`).join('')}
          </select>
          <button class="act warn" onclick="event.stopPropagation();markDead('${l.id}')">Mark dead</button>
        </div>
        <input class="linkinput" placeholder="Link (YouTube / IG / website)" value="${esc(l.link)}"
          onchange="setLink('${l.id}',this.value)" onclick="event.stopPropagation()">
        <div class="d-grid">
          <div>
            <div class="d-label">Notes / angle</div>
            <textarea class="notes" onchange="setNotes('${l.id}',this.value)" onclick="event.stopPropagation()">${esc(l.notes)}</textarea>
          </div>
          <div>
            <div class="d-label">History</div>
            <ul class="hist">${l.history.map(h=>`<li><b>${new Date(h.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</b> — ${esc(h.action)}</li>`).join('')}</ul>
          </div>
        </div>
      </div>
    </div>`;
  }).join('') || `<div class="rulecard">No leads match this filter.</div>`;
}

/* ---------- actions ---------- */
const get = id => state.leads.find(l=>l.id===id);

function toggleLead(id){ document.getElementById('row-'+id).classList.toggle('open'); }
function openLead(id){
  const r = document.getElementById('row-'+id);
  if(r){ r.classList.add('open'); r.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function promote(id){
  if(state.leads.filter(l=>l.inBatch).length >= BATCH_CAP){ toast('Batch is full — finish or kill a lead first'); return; }
  const l = get(id); l.inBatch = true; l.batchStart = now();
  if(l.stage==='backlog') l.stage='research';
  log(l,'Promoted to active batch'); save(); render(); toast(l.name+' → active batch');
}
function demote(id){
  const l = get(id); l.inBatch=false; l.batchStart=null;
  log(l,'Removed from batch'); save(); render();
}
function touch(id){
  const l = get(id);
  if(['sent','followup'].includes(l.stage)){
    l.followUps++; l.stage='followup';
    log(l,`Follow-up #${l.followUps} sent`);
  } else {
    l.stage = ['backlog','research','spec'].includes(l.stage) ? 'sent' : l.stage;
    log(l,'Outreach sent');
  }
  l.lastTouch = now(); save(); render(); toast('Touch logged');
}
function setStage(id,st){
  const l = get(id); l.stage = st;
  log(l,'Stage → '+STAGE_LABEL[st]);
  if(st==='won'||st==='dead'){ l.inBatch=false; l.batchStart=null; }
  if(st==='replied'||st==='call') l.lastTouch = now();
  save(); render();
}
function markDead(id){
  const l = get(id);
  setStage(id,'dead'); toast(l.name+' marked dead — revisit in ~3 months');
}
function setNotes(id,v){ get(id).notes=v; save(); }
function setLink(id,v){ get(id).link=v.trim(); save(); render(); }

function addLead(){
  const n = document.getElementById('addName').value.trim();
  if(!n){ toast('Name needed'); return; }
  state.leads.push(newLead({
    name:n,
    handle:document.getElementById('addHandle').value.trim(),
    link:document.getElementById('addLink').value.trim(),
    subs:document.getElementById('addSubs').value.trim()||'—',
    tier:document.getElementById('addTier').value
  }));
  ['addName','addHandle','addLink','addSubs'].forEach(i=>document.getElementById(i).value='');
  save(); render(); toast('Lead added');
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'frame-outreach-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importJSON(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ state = JSON.parse(r.result); save(); render(); toast('Backup imported'); }catch(e){ toast('Invalid file'); } };
  r.readAsText(f);
}

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load();
</script>
</body>
